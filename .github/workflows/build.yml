name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # NuGet.config restores from the vendored packages/ folder, and from nuget.org only the
      # packages mapped to it there, so this proves the vendored feed is still complete.
      - name: Restore
        run: dotnet restore Packman.sln

      - name: Verify third-party inventory
        run: python scripts/update-third-party-notices.py --check

      - name: Build
        run: dotnet build Packman.sln --no-restore -c Release

      # Every test program, the Python checks and tests/Packman.Tests, the same set a
      # contributor runs locally.
      - name: Run all tests (check.sh)
        shell: bash
        run: ./check.sh

      - name: Render native UI previews
        run: dotnet run --file scripts/RenderUiPreviews.cs -c Release -- artifacts/ui-previews

      - name: Package community desktop build
        run: dotnet publish Packman/Packman.csproj --no-build -c Release --self-contained false -o artifacts/Packman-community

      - name: Smoke launch packaged application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path artifacts/Packman-community/Packman.exe) -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($app.HasExited) { throw "Packman exited during startup with code $($app.ExitCode)." }
            if (-not $app.CloseMainWindow()) { throw "Packman did not create a main window." }
            if (-not $app.WaitForExit(10000)) { throw "Packman did not close cleanly." }
            if ($app.ExitCode -ne 0) { throw "Packman exited with code $($app.ExitCode)." }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Packman-community-windows
          path: artifacts/Packman-community/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-previews
          path: artifacts/ui-previews/*.png
          if-no-files-found: error

  # A v* tag builds, signs and publishes a GitHub Release. The version comes from the tag,
  # so Packman.csproj is not bumped by hand.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The tag reaches scripts below, so it goes through env and a strict pattern, never inline.
      - name: Read version from tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.Substring(1)
          if ($version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            throw "Tag '$env:REF_NAME' is not v<major>.<minor>.<patch> with an optional -suffix."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish
        shell: pwsh
        run: dotnet publish Packman/Packman.csproj -c Release --self-contained false "-p:Version=$env:VERSION" -o artifacts/Packman

      # Signing with a PFX held in repository secrets. To use Azure Trusted Signing instead,
      # replace this step with azure/trusted-signing-action (azure-tenant-id, azure-client-id,
      # endpoint, trusted-signing-account-name, certificate-profile-name, files-folder:
      # artifacts/Packman, files-folder-filter: exe,dll, file-digest: SHA256,
      # timestamp-rfc3161: http://timestamp.acs.microsoft.com, timestamp-digest: SHA256).
      - name: Sign Packman.exe and Packman.dll
        shell: pwsh
        env:
          SIGNING_CERT_PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_PFX_BASE64 -or -not $env:SIGNING_CERT_PASSWORD) {
            throw 'Set the SIGNING_CERT_PFX_BASE64 and SIGNING_CERT_PASSWORD repository secrets; releases are never published unsigned.'
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK.' }
          $files = 'artifacts/Packman/Packman.exe', 'artifacts/Packman/Packman.dll'
          $pfx = Join-Path $env:RUNNER_TEMP 'packman-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX_BASE64))
            & $signtool sign /f $pfx /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
            & $signtool verify /pa $files
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Zip and checksum
        shell: pwsh
        run: |
          $zip = "artifacts/Packman-$env:VERSION-win-x64.zip"
          Compress-Archive -Path artifacts/Packman/* -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -LiteralPath "$zip.sha256"
          "ZIP=$zip" >> $env:GITHUB_ENV

      # The runner's gh CLI, so no third-party action runs in a job that holds the signing secret.
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $flags = @('--verify-tag', '--generate-notes', '--title', "Packman $env:VERSION")
          if ($env:VERSION.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:REF_NAME $env:ZIP "$env:ZIP.sha256" @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
