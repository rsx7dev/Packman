'browse-installer':()=>dialog('Choose source installer',`<p>Select an installer from the sample source folder.</p><div class="code">C:\\Sources\\7z2409-x64.msi</div>`,'Select',()=>{$('#installer').value='C:\\Sources\\7z2409-x64.msi';toast('Installer metadata read')}),
'browse-package':()=>dialog('Choose package folder',`<div class="code">${path}</div>`,'Select',()=>toast('Package selected')),

['install','uninstall'].forEach(action=>actions['test-'+action]=()=>{$('#test-status').textContent='Running';$('#test-output').textContent=`09:42:01  Connecting to WKS-PILOT-014\n09:42:02  Staging package files…`;setTimeout(()=>{$('#test-output').textContent+=`\n09:42:04  Running ${action} as System\n09:42:08  Completed. Exit code: 0\n09:42:08  ${action==='install'?'Installation':'Uninstallation'} successful.`;$('#test-status').textContent='Completed'},1300)});
document.addEventListener('click',e=>{const row=e.target.closest('[data-row]');if(row){selected=Number(row.dataset.row);renderRows();updateSelection()}const sort=e.target.closest('[data-sort]');if(sort){const n=Number(sort.dataset.sort);sortAsc=n===sortIndex?!sortAsc:true;sortIndex=n;$$('[data-sort] .sort-arrow').forEach(x=>x.textContent='');sort.querySelector('.sort-arrow').textContent=sortAsc?'↑':'↓';renderRows()}const el=e.target.closest('[data-action]');if(el&&actions[el.dataset.action])actions[el.dataset.action](el);const settings=e.target.closest('[data-settings]');if(settings){e.preventDefault();$$('[data-settings]').forEach(x=>x.classList.toggle('active',x===settings));$$('[data-pane]').forEach(x=>x.classList.toggle('active',x.dataset.pane===settings.dataset.settings))}const mode=e.target.closest('[data-mode]');if(mode){$$('[data-mode]').forEach(x=>x.classList.toggle('active',x===mode));$('#create-hint').textContent=mode.dataset.mode==='upgrade'?'Upgrade existing: select the new installer version. Supersedence is reviewed on Configure.':'MSI metadata detected. Review the values before generating your package.'}if(e.target.closest('dialog a'))$('#dialog').close()});
document.addEventListener('dblclick',e=>{if(e.target.closest('[data-row]'))location.hash='overview'});
document.addEventListener('keydown',e=>{const row=e.target.closest('[data-row]');if(row&&e.key==='Enter'){selected=Number(row.dataset.row);updateSelection();location.hash='overview'}if((e.ctrlKey||e.metaKey)&&e.key==='s'&&location.hash==='#edit-script'){e.preventDefault();actions['save-script']()}});

document.querySelector('[data-action="refresh"]').setAttribute('aria-label', 'Refresh applications');
document.querySelector('[data-action="refresh"]').title = 'Refresh applications';
const computerInput = document.querySelector('[data-screen="remote-test"] input[value="WKS-PILOT-014"]');
computerInput.id = 'remote-computer';
for (const action of ['install', 'uninstall']) {
  const run = actions['test-' + action];
  actions['test-' + action] = () => {
    const name = computerInput.value.trim();
    if (!name || name.toLowerCase().includes('offline')) {
      $('#test-status').textContent = 'Not started';
      $('#test-output').textContent = name ? `Could not connect to ${name}.\nCheck that the device is online and WinRM is enabled, then try again.\nNo deployment was started.` : 'Enter a computer name before starting a test.\nNo deployment was started.';
      computerInput.focus();
      return;
    }
    run();
  };
}
window.addEventListener('hashchange',navigate);renderRows();updateSelection();navigate();
</script></body></html>
